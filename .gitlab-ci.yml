# Fails when a suite exists that no job above runs, or a job names a suite
# that no longer exists.
test-every-suite-is-scheduled:
  stage: test
  script:
    - sbt -batch "show Test/definedTestNames" | grep -o 'rial\.tests\.[A-Za-z0-9]*' | sort -u > defined.txt
    - grep -o 'rial\.tests\.[A-Za-z0-9]*' .gitlab-ci.yml | sort -u > scheduled.txt
    - diff defined.txt scheduled.txt

test-rialcpp:
  stage: test
  script:
    - sbt assembly
    - cd jni
    - cmake -B ./build
    - cmake --build ./build
    - ctest --test-dir ./build --output-on-failure
    - ./build/test/main > rialcpp-test.log || (tail -n 50 rialcpp-test.log; exit 1)
