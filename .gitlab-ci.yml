default:
  image: 10.5.6.16:5050/mdg5/chipenv:verilator5

stages:
  - test

# Every ScalaTest suite of src/test runs in exactly one of the jobs below,
# grouped by what it tests so that a red job names the area at a glance. A job
# runs its suites one sbt invocation each, one after another, so that no two
# Verilator builds ever share a JVM (they collide); the jobs run concurrently
# on separate runners. A category whose suites take long is split into jobs
# of a few minutes each.

test-arith:
  stage: test
  script:
    - sbt -J-Xmx4G "testOnly rial.tests.RealSimTest"
    - sbt -J-Xmx4G "testOnly rial.tests.AddFPTest"
    - sbt -J-Xmx4G "testOnly rial.tests.MultFPTest"
    - sbt -J-Xmx4G "testOnly rial.tests.MultFPIntTest"
    - sbt -J-Xmx4G "testOnly rial.tests.FMAFPTest"
    - sbt -J-Xmx4G "testOnly rial.tests.FusedMulAddRoundingSpec"
    - sbt -J-Xmx4G "testOnly rial.tests.FusedMulAddCancellationSpec"
    - sbt -J-Xmx4G "testOnly rial.tests.SplitMultiplierTest"
    - sbt -J-Xmx4G "testOnly rial.tests.MultiplyAddTest"

